<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Attendance</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #45a049; }
    </style>
    
    <!-- Prevent viewing this page from browser cache history -->
    <script>
        function preventBack() {
            window.history.forward(); 
        }
        setTimeout("preventBack()", 0);
        window.onunload = function () { null };
    </script>
</head>
<body onload="preventBack();">
<!-- This is a simple registration page -->
 <!-- Build your own style from here -->
<div class="container">
    <h2>Register Attendance</h2>
    <form action="/submit" method="POST">
        <!-- Pass the token hidden from the user so the server can validate it. -->
        <input type="hidden" name="token" value="{{ token }}">
        
        <div class="form-group">
            <label for="name">Student Name:</label>
            <input type="text" id="name" name="name" required autocomplete="off">
        </div>
        
        <div class="form-group">
            <label for="student_id">Student ID:</label>
            <input type="text" id="student_id" name="student_id" required autocomplete="off">
        </div>

        <div class="form-group">
            <label for="group">Group:</label>
            <input type="text" id="group" name="group" required autocomplete="off">
        </div>
        
        <button type="submit">Register</button>
    </form>
</div>

</body>
</html>
