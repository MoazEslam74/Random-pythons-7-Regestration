<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Registration</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  /* --- General page formatting --- */
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    background-color: #f4f4f9;
    flex-direction: column;
  }

  h2 {
    color: #333;
    margin-bottom: 20px;
  }

  /* QR Code container */
  #qrcode {
    background: white;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    margin-bottom: 30px; 
    display: flex;
    justify-content: center;
  }

  /* --- Timer formatting --- */
  .base-timer {
    position: relative;
    width: 300px;
    height: 300px;
    margin: 0 auto;
  }

  .base-timer__svg {
    transform: scaleX(-1);
  }

  .base-timer__circle {
    fill: none;
    stroke: none;
  }

  .base-timer__path-elapsed {
    stroke-width: 7px;
    stroke: #e6e6e6; 
  }

  .base-timer__path-remaining {
    stroke-width: 7px;
    stroke-linecap: round;
    transform: rotate(90deg);
    transform-origin: center;
    transition: 1s linear all;
    fill-rule: nonzero;
    stroke: currentColor;
  }

  .base-timer__path-remaining.green {
    color: rgb(65, 184, 131);
  }

  .base-timer__path-remaining.orange {
    color: orange;
  }

  .base-timer__path-remaining.red {
    color: red;
  }

  .base-timer__label {
    position: absolute;
    width: 300px;
    height: 300px;
    top: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    color: #333;
    font-weight: bold;
  }
</style>
</head>
<body>

  <h2>Scan QR Code to Register</h2>

  <div id="qrcode"></div>

  <div id="app"></div>
  <img src ='https://lh3.googleusercontent.com/d/1PX9l0Fa1kcISswPt3bw2nDlI_F8OG1Rs' alt="Dev. logo" style="position:fixed; bottom:10px; right:10px; width:50px; opacity:0.7; display: none;">
  <img src ='https://upload.wikimedia.org/wikipedia/commons/6/62/British_University_in_Egypt.png' alt="BUE logo" style="position:fixed; bottom:10px; right:85%; width:150px; border: 1px solid black;padding: 0.5px; ">

<script>
  // 1. Generate QR Code
  const link = "{{ public_url }}/enter?token={{ token }}";
  if(link && link.includes("http")) {
      new QRCode(document.getElementById("qrcode"), {
        text: link,
        width: 200,
        height: 200,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
      });
  } else {
      document.getElementById("qrcode").innerText = "Loading Link...";
  }

  // 2. Timer code (Timer Logic)
  const FULL_DASH_ARRAY = 283;
  
  // Fix: Receive time from Python
  // Put it in quotes so the editor doesn't complain, then convert to number
  const TIME_LIMIT = parseInt("{{ time_limit }}");
  // ------------------------------------------------

  // Made the warning (colors) percentage-based to work with any time you choose
  const WARNING_THRESHOLD = Math.floor(TIME_LIMIT * 0.3); // Orange starts when 30% of time remains
  const ALERT_THRESHOLD = Math.floor(TIME_LIMIT * 0.15);  // Red starts when 15% of time remains

  const COLOR_CODES = {
    info: { color: "green" },
    warning: { color: "orange", threshold: WARNING_THRESHOLD },
    alert: { color: "red", threshold: ALERT_THRESHOLD }
  };

  let timePassed = 0;
  let timeLeft = TIME_LIMIT;
  let timerInterval = null;
  let remainingPathColor = COLOR_CODES.info.color;

  document.getElementById("app").innerHTML = `
  <div class="base-timer">
    <svg class="base-timer__svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <g class="base-timer__circle">
        <circle class="base-timer__path-elapsed" cx="50" cy="50" r="45"></circle>
        <path
          id="base-timer-path-remaining"
          stroke-dasharray="283"
          class="base-timer__path-remaining ${remainingPathColor}"
          d="
            M 50, 50
            m -45, 0
            a 45,45 0 1,0 90,0
            a 45,45 0 1,0 -90,0
          "
        ></path>
      </g>
    </svg>
    <span id="base-timer-label" class="base-timer__label">${formatTime(timeLeft)}</span>
  </div>
  `;

  startTimer();

  function onTimesUp() {
    clearInterval(timerInterval);
    document.body.innerHTML = `
        <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; text-align:center;">
            <h1 style="color:#d9534f; font-size:4em; margin-bottom:10px;">⛔</h1>
            <h1 style="color:#333;">The time is over</h1>
            <p style="color:#666; font-size:1.2em;">The registration session has ended.</p>
        </div>
    `;
  }

  function startTimer() {
    timerInterval = setInterval(() => {
      timePassed = timePassed += 1;
      timeLeft = TIME_LIMIT - timePassed;
      document.getElementById("base-timer-label").innerHTML = formatTime(timeLeft);
      setCircleDasharray();
      setRemainingPathColor(timeLeft);

      if (timeLeft === 0) {
        onTimesUp();
      }
    }, 1000);
  }

  function formatTime(time) {
    const minutes = Math.floor(time / 60);
    let seconds = time % 60;
    if (seconds < 10) {
      seconds = `0${seconds}`;
    }
    return `${minutes}:${seconds}`;
  }

  function setRemainingPathColor(timeLeft) {
    const { alert, warning, info } = COLOR_CODES;
    if (timeLeft <= alert.threshold) {
      document
        .getElementById("base-timer-path-remaining")
        .classList.remove(warning.color);
      document
        .getElementById("base-timer-path-remaining")
        .classList.add(alert.color);
    } else if (timeLeft <= warning.threshold) {
      document
        .getElementById("base-timer-path-remaining")
        .classList.remove(info.color);
      document
        .getElementById("base-timer-path-remaining")
        .classList.add(warning.color);
    }
  }

  function calculateTimeFraction() {
    const rawTimeFraction = timeLeft / TIME_LIMIT;
    return rawTimeFraction - (1 / TIME_LIMIT) * (1 - rawTimeFraction);
  }

  function setCircleDasharray() {
    const circleDasharray = `${(
      calculateTimeFraction() * FULL_DASH_ARRAY
    ).toFixed(0)} 283`;
    document
      .getElementById("base-timer-path-remaining")
      .setAttribute("stroke-dasharray", circleDasharray);
  }
</script>

</body>
</html>
